server:
  port: 8080

spring:
  application:
    name: sael-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:sael.postgres.database.azure.com}:${DB_PORT:5432}/${DB_NAME:sael_db}
    username: ${DB_USER:sael}
    password: ${DB_PASS:Divine@59_Rra}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none          # Prisma owns the schema — never touch it
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: false

  flyway:
    enabled: false            # Prisma manages migrations

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

admin:
  secret: ${ADMIN_SECRET:9f7Kx2PqLm8Rw4NzYt6Vc3Hd1Bj5As0Q}

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvclNBRUxQbGF0Zm9ybTIwMjVTZWN1cmVCYXNlNjRGbmNvZGVkU3RyaW5n}
  access-token-expiry-ms: 86400000    # 24h
  refresh-token-expiry-ms: 604800000  # 7d

logging:
  level:
    root: INFO
    com.sael: DEBUG
    org.springframework.security: INFO

mqtt:
  broker-url: ${MQTT_BROKER_URL:ssl://localhost:8883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  client-id: ${MQTT_CLIENT_ID:sael-spring-ingester}
  conn-timeout: 30
  keep-alive: 60

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  voice-from: ${TWILIO_VOICE_FROM:}
